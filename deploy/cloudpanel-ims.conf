# Add inside the existing neurolinx.in HTTPS server block.
# Replace the earlier /IMS locations with this snippet.
# Apply only after the standalone IMS container is healthy on the chosen port.
# Keep proxy_pass without a trailing URI slash to preserve the /inventory-management-system prefix.
location = /IMS {
    return 301 /inventory-management-system$is_args$args;
}

location = /IMS/ {
    return 301 /inventory-management-system$is_args$args;
}

location = /inventory-management-system {
    proxy_pass http://127.0.0.1:3060;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /inventory-management-system/ {
    proxy_pass http://127.0.0.1:3060;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
