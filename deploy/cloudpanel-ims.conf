# Add inside the existing neurolinx.in HTTPS server block.
# Replace the earlier static /IMS blocks; do not append duplicate locations.
# Apply only after the standalone IMS container is healthy on the chosen port.
# Keep proxy_pass without a trailing URI slash to preserve the /IMS prefix.
location = /IMS {
    proxy_pass http://127.0.0.1:3060;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /IMS/ {
    proxy_pass http://127.0.0.1:3060;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
