services:
  ims:
    image: neurolinx-ims:portainer
    build: .
    pull_policy: build
    container_name: neurolinx-ims
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IMS_PORT:-3060}:80"
  auth:
    image: neurolinx-ims-auth:portainer
    build:
      context: .
      target: auth
    pull_policy: build
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ims
      PGUSER: ims
      PGPASSWORD: ${IMS_DB_PASSWORD:?Set IMS_DB_PASSWORD in Portainer}
      IMS_ADMIN_ID: ${IMS_ADMIN_ID:-NLXAM001X}
      IMS_ADMIN_HASH: ${IMS_ADMIN_HASH:?Set IMS_ADMIN_HASH in Portainer}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ims
      POSTGRES_USER: ims
      POSTGRES_PASSWORD: ${IMS_DB_PASSWORD:?Set IMS_DB_PASSWORD in Portainer}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - ims-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ims", "-d", "ims"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  ims-db:
