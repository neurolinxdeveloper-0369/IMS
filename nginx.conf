server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-store" always;

    location = / {
        return 302 /inventory-management-system/;
    }

    location = /inventory-management-system {
        default_type text/html;
        try_files /inventory-management-system/index.html =404;
    }

    location = /inventory-management-system/ {
        default_type text/html;
        try_files /inventory-management-system/index.html =404;
    }

    location = /inventory-management-system/index.html {
        try_files $uri =404;
    }

    location = /inventory-management-system/version.json {
        default_type application/json;
        try_files $uri =404;
    }

    location ^~ /inventory-management-system/assets/ {
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No company-site or smart-home SPA fallback belongs in this container.
    location / {
        return 404;
    }
}
