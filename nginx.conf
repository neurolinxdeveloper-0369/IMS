server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-store" always;

    location = / {
        return 302 /IMS/;
    }

    location = /IMS {
        default_type text/html;
        try_files /IMS/index.html =404;
    }

    location = /IMS/ {
        default_type text/html;
        try_files /IMS/index.html =404;
    }

    location = /IMS/index.html {
        try_files $uri =404;
    }

    location = /IMS/version.json {
        default_type application/json;
        try_files $uri =404;
    }

    location ^~ /IMS/assets/ {
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No company-site or smart-home SPA fallback belongs in this container.
    location / {
        return 404;
    }
}
