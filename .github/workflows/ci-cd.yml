name: IMS CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication and deployment so latest cannot race across pushes.
concurrency:
  group: ims-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build validation image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ims-ci:${{ github.sha }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ims
          cache-to: type=gha,mode=max,scope=ims
      - name: Validate container and routes
        run: bash scripts/check-image.sh "ims-ci:$GITHUB_SHA" "$GITHUB_SHA"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build release image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ims
          cache-to: type=gha,mode=max,scope=ims
      - name: Validate container and routes
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: bash scripts/check-image.sh "$IMAGE:sha-$GITHUB_SHA" "$GITHUB_SHA"
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "Published: $IMAGE:latest and $IMAGE:sha-$GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
      - name: Optional Portainer redeployment
        id: deploy
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [[ -z "$PORTAINER_WEBHOOK_URL" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Image published. Automatic deployment is not configured; deploy or re-pull it in Portainer." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$PORTAINER_WEBHOOK_URL" == https://* ]] || { echo "Portainer webhook must use HTTPS." >&2; exit 1; }
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --request POST "$PORTAINER_WEBHOOK_URL"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Verify the deployed commit
        if: steps.deploy.outputs.enabled == 'true'
        env:
          IMS_PUBLIC_URL: ${{ vars.IMS_PUBLIC_URL || 'https://neurolinx.in/IMS' }}
        run: |
          [[ "$IMS_PUBLIC_URL" == https://* ]] || { echo "IMS_PUBLIC_URL must use HTTPS." >&2; exit 1; }
          base="${IMS_PUBLIC_URL%/}"
          for attempt in {1..30}; do
            if metadata=$(curl --fail --silent --connect-timeout 5 --max-time 10 \
              --header 'Cache-Control: no-cache' "$base/version.json?commit=$GITHUB_SHA") && \
              jq -e --arg commit "$GITHUB_SHA" '.service == "neurolinx-ims" and .commit == $commit' <<< "$metadata" >/dev/null; then
              echo "The public IMS route serves commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Image published, but the public IMS route did not confirm the new commit. Check the stack image, re-pull settings and CloudPanel proxy." >&2
          exit 1
